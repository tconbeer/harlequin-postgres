name: Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# will cancel previous workflows triggered by the same event and for the same ref for PRs or same SHA otherwise
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ contains(github.event_name, 'pull_request') && github.event.pull_request.head.ref || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install python dependencies
        run: uv sync --locked

      - name: Run analysis
        run: |
          uv run --no-sync ruff format . --diff
          uv run --no-sync ruff check .
          uv run --no-sync mypy --no-incremental

  test:
    name: Python ${{ matrix.py }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"

    # The same database docker-compose.yml serves locally: the fixtures drop
    # and create the test database on every test, so they need the superuser.
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: for-testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          python-version: ${{ matrix.py }}
          enable-cache: true

      - name: Install python dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync pytest
